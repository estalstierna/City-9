<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>City 9 // Civil Protection</title>
  <meta name="description" content="A text roleplaying game set in an occupied city under the Universal Union. Enlist in the Combine Civil Authority and decide what kind of officer you become.">
  <meta name="theme-color" content="#0a0e11">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="City 9">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=block" rel="stylesheet">
  <!-- paint the dark background before the stylesheet arrives, so the app never flashes white -->
  <style>html, body { background: #0a0e11; color: #c9d3d8; margin: 0; }</style>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="pregame">
    <header id="topbar">
      <div class="brand"><span class="glyph">◈</span> <span id="tb-desig">CITIZEN TERMINAL</span></div>
      <div class="tb-right">
        <span id="tb-time"></span>
        <button id="btn-codex" title="Codex">Codex <span id="codex-count"></span></button>
        <button id="btn-roster" title="Division roster">Roster</button>
        <button id="btn-menu" title="Save / Load">Menu</button>
        <button id="btn-side" title="Dossier">Dossier</button>
      </div>
    </header>

    <main id="main">
      <div id="story" aria-live="polite"></div>
    </main>

    <aside id="sidebar">
      <div id="side-content"></div>
    </aside>

    <nav id="bottomnav" aria-label="Game"></nav>
  </div>

  <div id="modal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head"><span id="modal-title"></span><button id="modal-close" aria-label="Close">✕</button></div>
      <div id="modal-body"></div>
    </div>
  </div>
  <div id="toast"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <script src="js/engine.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/content/codex.js"></script>
  <script src="js/content/prologue.js"></script>
  <script src="js/content/training.js"></script>
  <script src="js/content/union.js"></script>
  <script src="js/content/duties.js"></script>
  <script src="js/content/beats.js"></script>
  <script src="js/content/search.js"></script>
  <script src="js/content/docs-game.js"></script>
  <script src="js/content/chapter2.js"></script>
  <script src="js/content/chapter3.js"></script>
  <script src="js/content/systems.js"></script>
  <script src="js/content/raids.js"></script>
  <script src="js/content/airwatch.js"></script>
  <script src="js/content/squad.js"></script>
  <script src="js/content/world.js"></script>
  <script src="js/content/routines.js"></script>
  <script src="js/content/crowd.js"></script>
  <script src="js/content/minigames2.js"></script>
  <script src="js/content/minigames3.js"></script>
  <script src="js/content/chapter4.js"></script>
  <script src="js/content/divisions.js"></script>
  <script src="js/content/duties2.js"></script>
  <script src="js/content/chapter5.js"></script>
  <script src="js/content/arcs.js"></script>
  <script src="js/content/lore.js"></script>
  <script src="js/content/career.js"></script>
  <script>
    G.boot();
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      /* No reload when a new version takes over: the service worker fetches the game's code
         network-first, so an online launch already runs the newest code. A reload here only
         made the app flash on every launch after an update. */
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => reg.update()).catch(() => {});
    }
  </script>
</body>
</html>
